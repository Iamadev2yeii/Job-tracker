# Companies scraped directly on their own career pages (Greater Munich
# only). Rebuilt from scratch around Prabha'''s actual field — ESG,
# Sustainability, Carbon Accounting, and Climate — rather than reused
# from the original PM/aerospace/defense-focused tracker this project
# was cloned from. Three groups:
#
#   1. Climate-tech / ESG-software startups (Tanso, IntegrityNext,
#      envoria, Ororatech, Ark Climate, Inplanet, and others) — the
#      closest match to her actual carbon-accounting/ESG-data
#      background, sourced from Munich'''s climate-tech startup scene
#      (Munich Startup, AENU'''s Munich Climate Tech Market Map).
#   2. ESG / sustainability consultancies with a Munich presence
#      (Anthesis, FTI Consulting, Baker Tilly, WTS Group, EurA,
#      Ramboll, Drees & Sommer, ERM, ACCONSIS, Capgemini) plus the
#      Big Four and TUEV SUED, all of which run real ESG advisory
#      practices.
#   3. Large Munich-area corporates/institutions with genuine,
#      verifiable sustainability or ESG-reporting functions —
#      finance/insurance (Allianz, Munich Re, BayernLB...), energy/
#      utilities (E.ON, TenneT, Stadtwerke Muenchen, BayWa r.e...),
#      industrials with real decarbonization programs (Siemens
#      Energy, MTU, Airbus, MAN Truck & Bus, Traton...), plus public
#      sector and research (Landeshauptstadt Muenchen, Fraunhofer,
#      DLR Oberpfaffenhofen, UnternehmerTUM, BUND Naturschutz Bayern).
#
# Deliberately dropped everything defense/space/military-adjacent
# from the original list (Hensoldt, Diehl Defence, KNDS, MBDA, OHB
# System, Eurofighter, ESO, the Max Planck astrophysics institutes,
# the various defense-tech startups, etc.) and a handful of other
# entries with no plausible ESG angle (GEMA, Baader Bank, BMW Bank,
# Tacterion, isotope/EOS optics, etc.) — not relevant to this search.
#
# `assume_local: true` — set on small, genuinely single-Munich-office
# companies only. For those, a job whose location came back blank
# (common — many platforms just don't expose it) is treated as a
# Munich match instead of being dropped, since there's realistically
# nowhere else it could be. Left unset (default false) for every
# multi-city/multi-country company, where a blank location genuinely
# could be anywhere and dropping it is the safer default.
#
# Many career URLs here are best-effort guesses for smaller/newer
# companies (same caveat as the original tracker) — see
# SETUP_GUIDE.md Part 7 for how to fix a `careers_url`/`ats` that
# isn't returning results. Add or remove entries freely.
