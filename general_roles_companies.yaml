# Extra sources specifically useful for the general/office-roles
# fallback section (config/general_roles_profile.yaml) — a broad set
# of staffing/temp agencies (general and admin/office-specialist),
# a handful of smaller Munich creative/communication agencies and
# studios, and international schools in the Munich area (all of
# which regularly hire secretaries/receptionists/office staff, not
# just their core specialty). These are ADDED to the scrape pool
# alongside companies.yaml and esg_job_boards.yaml — every company
# scraped feeds BOTH the sustainability pipeline and this general
# one, so nothing here needs to be sustainability-relevant, and
# nothing in companies.yaml is excluded from this broader search
# either.
#
# DIS AG and Amadeus Fire are worth calling out specifically: both
# are established Personaldienstleister with a dedicated Assistenz/
# Sekretariat/Backoffice specialism, not general-purpose agencies —
# about as close a match to this fallback sheet's intent as a
# staffing agency gets. Zenjob, Coople, and jobvalley (formerly
# Studitemps) are flexible/on-demand platforms, often the fastest
# realistic path to actually getting hired.
#
# Randstad, Adecco, Manpower, Orizon, Piening, and persona service
# URLs below were verified and corrected on 2026-08-11 — the
# original guesses used the wrong URL pattern for several of these
# and would have returned nothing. PINK Personalmanagement was
# dropped after no working candidate-facing jobs page could be
# found for it. avitea, ARWA, Kelly Services, Zenjob, and Coople are
# still best-effort constructions, not individually verified — same
# caveat as elsewhere in this project (see SETUP_GUIDE.md Part 7).
#
# Agency listings often anonymize the real hiring company — see the
# same caveat in esg_job_boards.yaml.
