name: Monthly tracker reset

on:
  schedule:
    # 1st of each month, 05:00 UTC (before that day's daily scrape).
    - cron: "0 5 1 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Archive and reset tracker
        run: python -m src.reset_tracker

      - name: Commit archived + fresh tracker
        run: |
          git config user.name "job-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add archive/ data/job_tracker.xlsx docs/index.html
          git diff --staged --quiet || git commit -m "Monthly tracker reset $(date -u +'%Y-%m')"
          git push
