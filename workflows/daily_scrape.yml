name: Daily job scrape

on:
  schedule:
    # 06:30 Munich time. GitHub Actions cron is UTC — 04:30 UTC covers
    # both CET (winter) and CEST (summer) close enough; the run will
    # land around 06:30 or 07:30 local time depending on the season.
    - cron: "30 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run scraper
        run: python -m src.main

      - name: Commit updated tracker
        run: |
          git config user.name "job-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/job_tracker.xlsx docs/index.html
          git diff --staged --quiet || git commit -m "Update job tracker $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
