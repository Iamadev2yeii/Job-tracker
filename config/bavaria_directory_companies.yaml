# Munich-metro-area companies imported from a broader Bavaria-wide
# business directory the user uploaded (1,325 companies total, mostly
# small local trades scattered across all of Bavaria — carpenters,
# cleaners, water utilities, bakeries, etc.). Filtered down to just
# the 165 with BOTH a Munich-metro address AND a verified own-domain
# website (17 more were dropped for pointing to a third-party
# directory/aggregator site instead of their own — e.g. backinjob.de,
# infobel.com — which would just scrape generic directory content,
# not that company's actual jobs).
#
# Deliberately NOT hand-sorted by sector/relevance: this batch is
# mostly small local businesses (facility services, construction,
# hospitality, manufacturing) with little inherent connection to
# sustainability — but every company here still gets checked against
# BOTH the sustainability and general-roles title lists like
# everything else in the Munich pool, so nothing irrelevant reaches
# either sheet; a company simply won't match if it has no ESG-titled
# or admin-titled opening. Kept as their own file so this large,
# unvetted batch is easy to remove or reduce later without touching
# the carefully curated companies.yaml.
#
# careers_url is a best-effort "<domain>/karriere" guess for every
# entry (same convention used throughout this project) — many of
# these very small companies won't have a structured careers page at
# all, so a high EMPTY rate here is expected, not a bug.
