# Real, targeted searches against Germany's official Bundesagentur für
# Arbeit Jobsuche API (see src/ats_scrapers.py, scrape_arbeitsagentur,
# for why this is a legitimate public API and not something scraped
# against a platform's wishes). Each entry is a full search query, not
# a single company — `ats: arbeitsagentur_api` tells the scraper to
# treat `careers_url` as a ready-to-call API query rather than a page
# to parse.
#
# `umkreis=30` (a 30km radius) is used throughout instead of a strict
# city match, since the API's own location search already handles
# "near this place" — the existing Munich-area location confirmation
# in src/matcher.py still runs afterward on the returned location text
# regardless, so nothing outside the metro area actually reaches a
# sheet even if the API's radius is slightly generous.
#
# The API gives the REAL hiring employer for every posting (unlike
# most agency sources) — main.py preserves that instead of overwriting
# it with this entry's own display name.
companies:
  # --- Sustainability-relevant searches (feed the "Jobs" sheet) ---
  - name: "Bundesagentur für Arbeit (Nachhaltigkeit, München)"
    city: Munich
    careers_url: "https://rest.arbeitsagentur.de/jobboerse/jobsuche-service/pc/v6/jobs?was=Nachhaltigkeit&wo=M%C3%BCnchen&umkreis=30"
    ats: arbeitsagentur_api
    board_token: ""
