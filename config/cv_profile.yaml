# Derived from Prabha Neupane's CV. Edit freely as the CV evolves —
# nothing here is fetched automatically, you keep it in sync by hand.
#
# title_must_match:
#   A job's TITLE must contain at least one of these (case-insensitive)
#   to be picked up at all. Covers ESG / sustainability / carbon /
#   climate roles in English and German, since German-language roles
#   are common for Munich-based postings even when the company also
#   posts in English internationally.
