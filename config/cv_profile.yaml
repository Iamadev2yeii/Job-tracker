# main_min_score:
#   No score floor is applied — every job that passes the title +
#   confirmed-Munich-area filter is shown, regardless of relevance
#   score. The score is still computed and used to sort the sheet
#   (highest first), just not used to exclude anything. Set above 0
#   later if you want a floor — the code fully supports it.
main_min_score: 0

# score_ceiling:
#   Used to convert the raw keyword-weight sum into a 1-10 scale shown
#   in the Excel tracker (10 = best match). Raise this if scores are
#   clustering too high; lower it if scores are clustering too low.
#   Many platforms (SmartRecruiters, Workday, generic HTML) don't
#   expose full description text, so those postings can only be
#   scored on title words alone — start at 12, same starting point
#   Giorgio's tracker used, and adjust once you've seen real results.
score_ceiling: 12

# scoring_keywords:
#   Each match inside the job description adds "weight" points toward
#   the raw score above, which then gets converted to the 1-10 scale.
#   Used to rank/sort results, not to filter them out. Drawn from
#   Prabha's CV: transaction-based carbon accounting, EEIO / global
#   input-output models (EXIOBASE, EORA), ISAE 3000 assurance work,
#   ESG portfolio analysis, sustainable finance taxonomies, and her
#   technical/data-analysis toolkit.
scoring_keywords:
  - {term: "carbon accounting", weight: 3}
  - {term: "ghg protocol", weight: 3}
  - {term: "scope 1", weight: 2}
  - {term: "scope 2", weight: 2}
