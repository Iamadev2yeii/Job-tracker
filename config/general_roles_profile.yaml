# "Munich Internships & Trainee" — Praktikum/Trainee postings in
# Munich, now TARGETED rather than any-field: a posting must be BOTH
# an internship/trainee-type title AND relevant to Prabha's field
# (title contains a relevance_keywords term below) — UNLESS it comes
# from a company whose core business already IS that field
# (`sustainability_related: true` in companies.yaml), in which case
# any internship/trainee title at that company counts, even a
# generically titled one like "Praktikum Marketing" at a climate-tech
# startup.
#
# This replaces an earlier "any field at all" version of this sheet,
# reverted after it surfaced a Korean-market trainee program with no
# connection to Prabha's background — being broad on field with no
# relevance gate let in postings from literally any industry.
# Werkstudent (working-student) roles remain deliberately excluded —
# internships and traineeships only.
title_must_match:
  - "praktikum"
  - "praktikant"
  - "praktikantin"
  - "trainee"
  - "traineeprogramm"
  - "internship"
  - "intern"

# Title must ALSO contain one of these (unless the company is flagged
# sustainability_related) — English + German sustainability/
# environment/carbon terms, mirroring cv_profile.yaml's field.
relevance_keywords:
  - "sustainability"
  - "nachhaltigkeit"
  - "nachhaltig"
  - "esg"
  - "carbon"
  - "co2"
  - "climate"
  - "klima"
  - "klimaschutz"
  - "environmental"
  - "umwelt"
  - "umweltschutz"
  - "csr"
  - "csrd"
  - "biodiversity"

main_min_score: 0
score_ceiling: 8

# "Remotely matches her CV" scoring — not a filter, purely a ranking
# signal among the already sustainability-relevant postings above.
# Generic corporate buzzwords (communication, reporting, research,
# multilingual) were dropped after one inflated the score of an
# otherwise-irrelevant posting — almost any professional trainee
# program description touches those words regardless of actual fit.
scoring_keywords:
  # "green" / "erneuerbare" / "renewable" / "energie" / "energy" /
  # "circular economy" / "kreislaufwirtschaft" used to be in
  # relevance_keywords (the strict gate) — removed after testing
  # confirmed they let through non-ESG-function internships in those
  # industries (e.g. "Praktikum Energiehandel" — an energy trading
  # internship, not a sustainability function). They're real,
  # relevant themes though, so they stay here as ranking signals: an
  # internship that already passed the gate via a genuine ESG-
  # function term ranks higher if it also touches these themes,
  # without letting them serve as a gate on their own.
  - {term: "green", weight: 1}
  - {term: "erneuerbare", weight: 1}
  - {term: "renewable", weight: 1}
  - {term: "energie", weight: 1}
  - {term: "energy", weight: 1}
  - {term: "circular economy", weight: 1}
  - {term: "kreislaufwirtschaft", weight: 1}
  - {term: "sustainability", weight: 2}
  - {term: "nachhaltigkeit", weight: 2}
  - {term: "esg", weight: 2}
  - {term: "carbon", weight: 2}
  - {term: "climate", weight: 2}
  - {term: "klima", weight: 2}
  - {term: "environmental", weight: 2}
  - {term: "umwelt", weight: 2}
  - {term: "csr", weight: 1}
  - {term: "project management", weight: 2}
  - {term: "projektmanagement", weight: 2}
  - {term: "program officer", weight: 1}
  - {term: "data analysis", weight: 2}
  - {term: "datenanalyse", weight: 2}
  - {term: "python", weight: 1}
  - {term: "r programming", weight: 1}
  - {term: "gis", weight: 1}
  - {term: "arcgis", weight: 1}
  - {term: "stakeholder management", weight: 1}
  - {term: "agile", weight: 1}
  - {term: "scrum", weight: 1}
  - {term: "jira", weight: 1}
  - {term: "confluence", weight: 1}
