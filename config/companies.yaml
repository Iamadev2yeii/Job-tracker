# Companies scraped directly on their own career pages (Greater Munich
# only). Built around Prabha's actual field -- ESG, Sustainability,
# Carbon Accounting, and Climate. Three main groups, plus a later
# batch of additional verified sustainability consultancies/startups:
#
# `sustainability_related: true` is set on every company in this file
# — it feeds the "Munich Internships & Trainee" sheet's per-company
# exemption (config/general_roles_profile.yaml): an internship/
# trainee posting from a company flagged this way counts regardless
# of its own title, since the company's core business already is
# this field (e.g. "Praktikum Marketing" at a climate-tech startup
# still counts). Companies in general_roles_companies.yaml and
# bavaria_directory_companies.yaml are NOT flagged, since most of
# them have no inherent sustainability angle — their internships need
# an explicit relevance keyword in the title instead.
#
#   1. Climate-tech / ESG-software startups (Tanso, IntegrityNext,
#      envoria, Ororatech, Ark Climate, Inplanet, sustamize, and
#      others) -- the closest match to her actual carbon-accounting/
#      ESG-data background, sourced from Munich's climate-tech scene.
#   2. ESG / sustainability consultancies with a Munich presence
#      (Anthesis, FTI Consulting, Baker Tilly, WTS Group, EurA,
#      Ramboll, Drees & Sommer, ERM, ACCONSIS, Arqum, DFGE, ACCON,
#      BAUM Consult, Capgemini) plus the Big Four and TUEV SUED, all
#      of which run real ESG advisory practices.
#   3. Large Munich-area corporates/institutions with genuine,
#      verifiable sustainability or ESG-reporting functions --
#      finance/insurance (Allianz, Munich Re, BayernLB...), energy/
#      utilities (E.ON, TenneT, Stadtwerke Muenchen, BayWa r.e.,
#      Orcan Energy, Reverion, Siqens...), industrials with real
#      decarbonization programs (Siemens Energy, MTU, Airbus, MAN
#      Truck & Bus, Traton...), plus public sector and research
#      (Landeshauptstadt Muenchen, Fraunhofer, DLR Oberpfaffenhofen,
#      UnternehmerTUM, BUND Naturschutz Bayern).
#
# Deliberately excludes defense/space/military-adjacent companies and
# a handful of entries with no plausible ESG angle. This sheet is
# picked directly from company career pages only -- no job boards or
# staffing agencies feed it (see config/esg_job_boards.yaml, which is
# no longer loaded into the Munich pool by src/main.py). The
# Bundesagentur API searches in config/arbeitsagentur_searches.yaml
# are the one exception, since they return the real hiring employer
# for each posting -- the same spirit as "direct from companies,"
# just a different mechanism.
#
# `assume_local: true` -- set on small, genuinely single-Munich-office
# companies only; for those, a blank location is treated as a Munich
# match instead of being dropped. Left unset for multi-city companies.
#
# Many career URLs are best-effort "<domain>/karriere" guesses for
# smaller/newer companies -- see SETUP_GUIDE.md Part 7 for how to fix
# one that isn't returning results.
