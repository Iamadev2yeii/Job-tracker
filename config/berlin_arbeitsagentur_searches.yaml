# Real, targeted searches against Germany's official Bundesagentur für
# Arbeit Jobsuche API — the Berlin equivalent of
# arbeitsagentur_searches.yaml (see src/ats_scrapers.py,
# scrape_arbeitsagentur, and that file's comments for why this is a
# legitimate public API and how the response quirks were worked out).
#
# This is genuinely the highest-leverage source for Berlin: rather
# than hand-naming a fraction of the 500+ sustainability companies and
# hubs reportedly in Berlin, these 6 searches query the largest job
# database in Germany directly and return the REAL hiring employer
# for every result — far more scalable than a manually curated list
# could ever be.
#
# assume_relevant_title: true is set on all of these (same reasoning
# as the Munich searches) — the API's own "was" free-text search
# matches thematically, not by literal substring in the returned
# job's title, so re-checking that substring on top would wrongly
# reject genuine matches.
companies:
#
# Expanded from 6 to 30 keyword searches -- same reasoning as
# arbeitsagentur_searches.yaml (the Munich equivalent): each
# additional keyword is a real, zero-fabrication-risk source
# querying Germany's actual job database directly. New terms
# cover renewable energy, circular economy, hydrogen, recycling,
# biodiversity, sustainable finance, sustainable construction,
# and more.
- name: Bundesagentur für Arbeit (Nachhaltigkeit, Berlin)
  city: Berlin
  careers_url: https://rest.arbeitsagentur.de/jobboerse/jobsuche-service/pc/v6/jobs?was=Nachhaltigkeit&wo=Berlin&umkreis=30
  ats: arbeitsagentur_api
  board_token: ''
  assume_relevant_title: true
