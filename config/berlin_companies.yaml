# Companies scraped directly on their own career pages, Berlin metro
# area — the equivalent of companies.yaml, for the new "Jobs - Berlin"
# sheet. Same philosophy as Munich's "Jobs" sheet: picked directly
# from company career pages plus the Bundesagentur API
# (config/berlin_arbeitsagentur_searches.yaml) — no job boards or
# staffing agencies feed this sheet either.
#
# `sustainability_related: true` is set on every entry here — not
# currently used by any Berlin-specific pipeline logic (there's no
# Berlin internships sheet yet), but kept for consistency with
# companies.yaml in case that's added later.
#
# Three groups, sourced via research (EU-Startups' "Sustainability
# Startups in Berlin", ensun's "Climate Tech Companies in Germany",
# Tech in Berlin's climate tech directory):
#
#   1. Climate-tech / ESG-software startups — Plan A and ecolytiq are
#      the closest match to Prabha's actual carbon-accounting/ESG-data
#      background (ecolytiq is, per her CV, her actual former
#      employer — genuinely worth watching for openings there).
#   2. Climate policy / research institutes — Berlin's think-tank
#      ecosystem (adelphi, Agora Energiewende, Climate Analytics,
#      Ecologic Institute, PIK Potsdam) is a real structural advantage
#      over Munich for someone with her academic/policy-adjacent
#      background (EGU conference paper, TUM Sustainable Resource
#      Management degree).
#   3. Large Berlin-headquartered corporates/utilities/NGOs with
#      genuine sustainability functions (Deutsche Bahn, Vattenfall
#      Deutschland, GASAG, Zalando, WWF Deutschland, Deutsche
#      Umwelthilfe, GIZ).
#
# `assume_local: true` is set on the smaller single-Berlin-office
# companies/institutes only, same meaning as in companies.yaml.
# Career URLs are best-effort "<domain>/karriere" guesses for smaller
# organizations, same caveat as everywhere else in this project.
