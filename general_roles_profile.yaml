# REPURPOSED: this used to be a broad office/admin fallback sheet.
# Per request, it's now "Internships & Traineeships (Munich, any
# field)" — Praktikum/Trainee postings in Munich, deliberately NOT
# restricted to office/admin work and NOT restricted to sustainability
# either — any field counts, since the point here is getting Prabha
# employed quickly, not a specialty match. Werkstudent (working-
# student) roles are deliberately excluded — trainee/internship only.
#
# The relevance score still matters, though: scoring_keywords below
# are drawn from Prabha's actual CV (environmental science, carbon
# accounting/ESG, project management, data analysis, languages) so
# that an internship touching on any of those themes ranks higher
# than one that doesn't — without excluding anything else, since
# main_min_score stays 0.
title_must_match:
  - "praktikum"
  - "praktikant"
  - "praktikantin"
  - "trainee"
  - "traineeprogramm"
  - "internship"
  - "intern"

main_min_score: 0
score_ceiling: 10

# "Remotely matches her CV" scoring — not a filter, purely a ranking
# signal across whatever field the internship/trainee posting is
# actually in.
scoring_keywords:
  - {term: "sustainability", weight: 2}
  - {term: "nachhaltigkeit", weight: 2}
  - {term: "esg", weight: 2}
  - {term: "carbon", weight: 2}
  - {term: "climate", weight: 2}
  - {term: "klima", weight: 2}
  - {term: "environmental", weight: 2}
  - {term: "umwelt", weight: 2}
  - {term: "csr", weight: 1}
  - {term: "project management", weight: 2}
  - {term: "projektmanagement", weight: 2}
  - {term: "program officer", weight: 1}
  - {term: "data analysis", weight: 2}
  - {term: "datenanalyse", weight: 2}
  - {term: "python", weight: 1}
  - {term: "r programming", weight: 1}
  - {term: "gis", weight: 1}
  - {term: "arcgis", weight: 1}
  - {term: "research", weight: 1}
  - {term: "forschung", weight: 1}
  - {term: "stakeholder", weight: 1}
  - {term: "reporting", weight: 1}
  - {term: "berichterstattung", weight: 1}
  - {term: "agile", weight: 1}
  - {term: "scrum", weight: 1}
  - {term: "jira", weight: 1}
  - {term: "confluence", weight: 1}
  - {term: "multilingual", weight: 1}
  - {term: "mehrsprachig", weight: 1}
  - {term: "communication", weight: 1}
  - {term: "kommunikation", weight: 1}
